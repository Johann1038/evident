[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evident"
version = "0.1.0"
description = "Evidence-graded exposure assessment and resolver-verified remediation of transitive vulnerabilities in Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "packaging>=24",
    "networkx>=3.2",
    "ortools>=9.10",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "cvss>=3.1",
    "uv>=0.4",
]

[project.optional-dependencies]
paper = ["matplotlib>=3.8", "python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
evident = "evident.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
